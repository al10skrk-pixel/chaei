<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 수중 수족관 (공기방울 & 일렁임 & 스크린 효과 추가)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01152a; /* 심해 느낌의 배경색 */
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        /* SVG 필터 및 CSS 애니메이션이 적용될 배경 컨테이너 */
        #bg-container {
            position: absolute;
            top: -10%; 
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('https://cdn.pixabay.com/photo/2016/11/18/19/09/bubbles-1836457_1280.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: url(#water-filter) brightness(0.85); 
            z-index: 1;
        }

        @keyframes sway {
            0% { transform: scale(1.05) translate(0, 0) rotate(0deg); }
            33% { transform: scale(1.1) translate(1.5%, 1%) rotate(0.5deg); }
            66% { transform: scale(1.08) translate(-1%, 1.5%) rotate(-0.5deg); }
            100% { transform: scale(1.05) translate(0, 0) rotate(0deg); }
        }

        /* 공기방울 효과 래퍼 */
        #bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ----------------------------------------------------
         * 새로 추가된 영역: 스크린 레이어 효과 (z-index: 6, 생물 레이어보다 위)
         * ---------------------------------------------------- */
        #screen-layer {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 6;
            pointer-events: none;

            mix-blend-mode: screen; /* 스크린 레이어 효과 */
            filter: blur(10px);      /* 블러 10px */

            object-fit: cover;

            animation: sway 15s ease-in-out infinite alternate,
                       screen-wave 6s ease-in-out infinite alternate;
        }

        @keyframes screen-wave {
            0% { opacity: 0.15; }
            50% { opacity: 0.25; }
            100% { opacity: 0.15; }
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* 수중 생물들이 헤엄칠 공간 */
        #aquarium {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* UI 영역 */
        #ui-layer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .upload-btn:active {
            transform: translateY(1px);
        }

        #file-input {
            display: none;
        }

        .creature {
            position: absolute;
            will-change: transform;
            transform-origin: center center;
        }

        .creature img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            animation: squirm 4s ease-in-out infinite alternate;
            transform-origin: center center;
        }

        @keyframes squirm {
            0% { transform: scale(1, 1) translateY(0); }
            50% { transform: scale(1.1, 0.9) translateY(3px); }
            100% { transform: scale(0.95, 1.05) translateY(-3px); }
        }
        
        .instruction {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- SVG Filter for stronger underwater ripple effect -->
    <svg style="display: none;">
        <filter id="water-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015" numOctaves="3" result="noise" seed="1">
                <animate attributeName="baseFrequency" values="0.01 0.015; 0.015 0.02; 0.01 0.015" dur="12s" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- 배경 컨테이너 (z-index: 1) -->
    <div id="bg-container"></div>

    <!-- 공기방울 컨테이너 (z-index: 2) -->
    <div id="bubble-container"></div>

    <!-- 생물들이 헤엄치는 수족관 (z-index: 5) -->
    <div id="aquarium"></div>

    <!-- 요청하신 스크린 오버레이 레이어 (z-index: 6, 생물 위로 이동하여 첨부 이미지에도 적용됨) -->
    <img id="screen-layer" src="https://cdn.pixabay.com/photo/2016/11/19/09/46/ocean-1838340_1280.jpg" alt="Screen Overlay">

    <!-- UI (z-index: 10) -->
    <div id="ui-layer">
        <div class="instruction">사진을 추가하여 바다에 띄워보세요</div>
        <button class="upload-btn" id="upload-btn">사진 선택하기</button>
        <input type="file" id="file-input" multiple accept="image/*">
    </div>

    <script>
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const aquarium = document.getElementById('aquarium');
        const bubbleContainer = document.getElementById('bubble-container');
        
        let swimmers = [];
        let time = 0;

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imgSrc = event.target.result;
                    createCreature(imgSrc);
                };
                reader.readAsDataURL(file);
            });
            
            fileInput.value = '';
        });

        // 공기방울 생성 로직
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            const size = 10 + Math.random() * 15;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            bubble.style.left = `${Math.random() * 100}%`;
            
            const duration = 5 + Math.random() * 7;
            bubble.style.animationDuration = `${duration}s`;
            
            bubbleContainer.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, duration * 1000);
        }

        setInterval(createBubble, 400);

        // 수중 생물 생성 로직
        function createCreature(src) {
            const container = document.createElement('div');
            container.className = 'creature';

            const img = document.createElement('img');
            img.src = src;

            const duration = 3 + Math.random() * 2;
            img.style.animationDuration = `${duration}s`;
            img.style.animationDelay = `-${Math.random() * 5}s`;

            container.appendChild(img);
            aquarium.appendChild(container);

            const size = 80 + Math.random() * 120;
            container.style.width = `${size}px`;
            container.style.height = `${size}px`;

            const swimmer = {
                el: container,
                x: Math.random() * (window.innerWidth - size),
                y: Math.random() * (window.innerHeight - size),
                vx: (Math.random() - 0.5) * 1.2, 
                vy: (Math.random() - 0.5) * 1.2, 
                size: size,
                baseOffset: Math.random() * 100 
            };

            swimmers.push(swimmer);
        }

        // 수중 유영 애니메이션 루프
        function updateSwimmers() {
            time += 0.015;

            swimmers.forEach(s => {
                let currentVx = s.vx + Math.sin(time + s.baseOffset) * 0.25;
                let currentVy = s.vy + Math.cos(time * 0.8 + s.baseOffset) * 0.25;

                s.x += currentVx;
                s.y += currentVy;

                if (s.x < -s.size / 2) {
                    s.x = -s.size / 2;
                    s.vx = Math.abs(s.vx);
                } else if (s.x > window.innerWidth - s.size / 2) {
                    s.x = window.innerWidth - s.size / 2;
                    s.vx = -Math.abs(s.vx);
                }

                if (s.y < -s.size / 2) {
                    s.y = -s.size / 2;
                    s.vy = Math.abs(s.vy);
                } else if (s.y > window.innerHeight - s.size / 2) {
                    s.y = window.innerHeight - s.size / 2;
                    s.vy = -Math.abs(s.vy);
                }

                let angle = Math.atan2(currentVy, currentVx) * (180 / Math.PI) + 90;
                s.el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${angle}deg)`;
            });

            requestAnimationFrame(updateSwimmers);
        }

        window.addEventListener('resize', () => {
            swimmers.forEach(s => {
                if(s.x > window.innerWidth) s.x = window.innerWidth - s.size;
                if(s.y > window.innerHeight) s.y = window.innerHeight - s.size;
            });
        });

        requestAnimationFrame(updateSwimmers);

        for(let i=0; i<10; i++) {
            setTimeout(createBubble, Math.random() * 2000);
        }
    </script>
</body>
</html>
