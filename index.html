<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jellyfish Swimmer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#031820; }
  body { display:grid; place-items:center; font-family:system-ui,sans-serif; }
  .ocean {
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9;
    overflow:hidden;
    background:
      linear-gradient(#0002,#0002),
      url("https://cdn.pixabay.com/photo/2019/06/20/09/26/underwater-4286600_1280.jpg")
      center/cover no-repeat;
    isolation:isolate;
  }
  .ocean::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 35%,#00151d99 100%);
    z-index:5;
  }
  #creatures { position:absolute; inset:0; overflow:hidden; }
  .creature {
    position:absolute; left:0; top:0;
    width:clamp(70px,11vw,170px);
    max-width:24%;
    pointer-events:none;
    will-change:transform;
    filter:drop-shadow(0 8px 14px #00101888);
    animation:drift var(--dur) ease-in-out infinite alternate;
  }
  .creature img {
    width:100%; display:block; object-fit:contain;
    animation:pulse var(--pulse) ease-in-out infinite;
    transform-origin:50% 45%;
    opacity:.92;
  }
  @keyframes pulse {
    0%,100% { transform:scaleX(1) scaleY(1) rotate(-2deg); }
    50% { transform:scaleX(.88) scaleY(1.08) rotate(2deg); }
  }
  @keyframes drift {
    0% { transform:translate3d(var(--x0),var(--y0),0) rotate(var(--r0)); }
    50% { transform:translate3d(var(--x1),var(--y1),0) rotate(var(--r1)); }
    100% { transform:translate3d(var(--x2),var(--y2),0) rotate(var(--r2)); }
  }
  #picker {
    position:absolute; z-index:10; left:50%; top:50%;
    transform:translate(-50%,-50%);
    padding:14px 20px; border:1px solid #ffffff55; border-radius:999px;
    color:white; background:#031820aa; backdrop-filter:blur(8px);
    cursor:pointer; font-weight:700; letter-spacing:.03em;
    box-shadow:0 5px 25px #0006;
  }
  #file { display:none; }
  #hint {
    position:absolute; z-index:10; left:50%; bottom:18px; transform:translateX(-50%);
    color:#eaffffcc; font-size:12px; text-align:center; pointer-events:none;
  }
  .bubble {
    position:absolute; border:1px solid #ffffff77; border-radius:50%;
    width:var(--s); height:var(--s); left:var(--x); top:var(--y);
    animation:bubble var(--d) linear infinite; opacity:0;
  }
  @keyframes bubble {
    0% { transform:translateY(20px) scale(.7); opacity:0; }
    15% { opacity:.5; } 100% { transform:translateY(-120px) translateX(20px) scale(1.1); opacity:0; }
  }
</style>
</head>
<body>
<main class="ocean" id="ocean">
  <div id="creatures"></div>
  <label id="picker">사진을 선택해 바다에 띄우기
    <input id="file" type="file" accept="image/*">
  </label>
  <div id="hint">사진을 선택하면 해파리처럼 천천히 꾸물거리며 유영합니다 </div>
</main>

<script>
const ocean = document.getElementById('ocean');
const creatures = document.getElementById('creatures');
const file = document.getElementById('file');
const picker = document.getElementById('picker');

function rand(a,b){ return Math.random()*(b-a)+a; }
function makeBubbles(){
  for(let i=0;i<18;i++){
    const b=document.createElement('i');
    b.className='bubble';
    b.style.setProperty('--s',`${rand(3,11)}px`);
    b.style.setProperty('--x',`${rand(0,100)}%`);
    b.style.setProperty('--y',`${rand(50,100)}%`);
    b.style.setProperty('--d',`${rand(6,15)}s`);
    b.style.animationDelay=`-${rand(0,15)}s`;
    ocean.appendChild(b);
  }
}
makeBubbles();

file.addEventListener('change', e => {
  const f=e.target.files?.[0];
  if(!f) return;
  const url=URL.createObjectURL(f);

  const c=document.createElement('div');
  c.className='creature';
  const img=document.createElement('img');
  img.src=url;
  img.alt='사용자가 선택한 이미지';
  c.appendChild(img);

  const w=ocean.clientWidth, h=ocean.clientHeight;
  const x0=rand(-w*.08,w*.82), y0=rand(h*.05,h*.72);
  const x1=Math.max(-w*.08,Math.min(w*.78,x0+rand(-w*.18,w*.18)));
  const y1=Math.max(h*.03,Math.min(h*.78,y0+rand(-h*.20,h*.20)));
  const x2=Math.max(-w*.08,Math.min(w*.82,x1+rand(-w*.18,w*.22)));
  const y2=Math.max(h*.03,Math.min(h*.82,y1+rand(-h*.16,h*.16)));

  c.style.setProperty('--x0',`${x0}px`);
  c.style.setProperty('--y0',`${y0}px`);
  c.style.setProperty('--x1',`${x1}px`);
  c.style.setProperty('--y1',`${y1}px`);
  c.style.setProperty('--x2',`${x2}px`);
  c.style.setProperty('--y2',`${y2}px`);
  c.style.setProperty('--r0',`${rand(-8,8)}deg`);
  c.style.setProperty('--r1',`${rand(-18,18)}deg`);
  c.style.setProperty('--r2',`${rand(-10,10)}deg`);
  c.style.setProperty('--dur',`${rand(13,22)}s`);
  c.style.setProperty('--pulse',`${rand(2.3,3.8)}s`);

  creatures.replaceChildren(c);
  picker.style.display='none';
  document.getElementById('hint').style.display='none';
});
</script>
</body>
</html>
