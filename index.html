<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 수중 수족관</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01152a; /* 심해 느낌의 배경색 */
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        /* SVG 필터가 적용될 배경 컨테이너 */
        #bg-container {
            position: absolute;
            top: -5%; /* 필터 일그러짐 테두리를 숨기기 위해 여유 공간 할당 */
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('https://cdn.pixabay.com/photo/2019/06/20/09/26/underwater-4286600_1280.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: url(#water-filter) brightness(0.85); /* 바닷속 일렁임 효과 및 약간 어둡게 */
            z-index: 1;
        }

        /* 수중 생물들이 헤엄칠 공간 */
        #aquarium {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* 배경이나 UI 클릭을 방해하지 않음 */
        }

        /* UI 영역 */
        #ui-layer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .upload-btn:active {
            transform: translateY(1px);
        }

        #file-input {
            display: none;
        }

        /* 업로드된 생물체 래퍼 */
        .creature {
            position: absolute;
            will-change: transform; /* JS 애니메이션 성능 최적화 */
            transform-origin: center center;
        }

        /* 생물체 이미지 (해파리처럼 꾸물거리는 모션) */
        .creature img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            animation: squirm 3s ease-in-out infinite alternate;
            transform-origin: center center;
        }

        /* 해파리의 수축 및 팽창을 모방한 CSS 키프레임 */
        @keyframes squirm {
            0% {
                transform: scale(1, 1) translateY(0);
            }
            50% {
                transform: scale(1.15, 0.85) translateY(5px);
            }
            100% {
                transform: scale(0.9, 1.1) translateY(-5px);
            }
        }
        
        .instruction {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- SVG Filter for the underwater ripple effect -->
    <svg style="display: none;">
        <filter id="water-filter">
            <!-- baseFrequency를 조정하여 물결의 크기를 설정 -->
            <feTurbulence type="fractalNoise" baseFrequency="0.015 0.02" numOctaves="2" result="turbulence">
                <animate attributeName="baseFrequency" values="0.015 0.02; 0.02 0.025; 0.015 0.02" dur="8s" repeatCount="indefinite"/>
            </feTurbulence>
            <!-- scale을 조정하여 물결의 세기를 설정 -->
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="15" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </svg>

    <!-- 배경 컨테이너 -->
    <div id="bg-container"></div>

    <!-- 생물들이 헤엄치는 수족관 -->
    <div id="aquarium"></div>

    <!-- UI -->
    <div id="ui-layer">
        <div class="instruction">사진을 추가하여 바다에 띄워보세요</div>
        <button class="upload-btn" id="upload-btn">사진 선택하기 (다중 선택 가능)</button>
        <input type="file" id="file-input" multiple accept="image/*">
    </div>

    <script>
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const aquarium = document.getElementById('aquarium');
        
        let swimmers = [];
        let time = 0;

        // 버튼 클릭 시 숨겨진 file input 클릭
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 파일이 선택되었을 때
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const imgSrc = event.target.result;
                    createCreature(imgSrc);
                };
                reader.readAsDataURL(file);
            });
            
            // 입력 초기화 (같은 파일을 다시 선택할 수 있게)
            fileInput.value = '';
        });

        function createCreature(src) {
            const container = document.createElement('div');
            container.className = 'creature';

            const img = document.createElement('img');
            img.src = src;

            // 랜덤 꾸물거림 애니메이션 주기 및 딜레이 설정 (자연스러움을 위해)
            const duration = 2 + Math.random() * 2; // 2초 ~ 4초
            img.style.animationDuration = `${duration}s`;
            img.style.animationDelay = `-${Math.random() * 5}s`; // 서로 다른 타이밍에 시작

            container.appendChild(img);
            aquarium.appendChild(container);

            // 생물 크기 랜덤 설정 (80px ~ 200px)
            const size = 80 + Math.random() * 120;
            container.style.width = `${size}px`;
            container.style.height = `${size}px`;

            // 초기 위치 및 속도 설정
            const swimmer = {
                el: container,
                x: Math.random() * (window.innerWidth - size),
                y: Math.random() * (window.innerHeight - size),
                vx: (Math.random() - 0.5) * 3, // X축 기본 속도
                vy: (Math.random() - 0.5) * 3, // Y축 기본 속도
                size: size,
                baseOffset: Math.random() * 100 // 사인파 변동을 위한 랜덤 오프셋
            };

            swimmers.push(swimmer);
        }

        // 수중 유영 애니메이션 루프
        function updateSwimmers() {
            time += 0.02; // 시간의 흐름 (사인파 활용 용도)

            swimmers.forEach(s => {
                // 부드러운 유영을 위해 속도에 사인파(노이즈) 적용
                let currentVx = s.vx + Math.sin(time + s.baseOffset) * 0.5;
                let currentVy = s.vy + Math.cos(time * 0.8 + s.baseOffset) * 0.5;

                s.x += currentVx;
                s.y += currentVy;

                // 화면 경계에 닿으면 부드럽게 튕겨나오기 (반전)
                if (s.x < -s.size / 2) {
                    s.x = -s.size / 2;
                    s.vx = Math.abs(s.vx);
                } else if (s.x > window.innerWidth - s.size / 2) {
                    s.x = window.innerWidth - s.size / 2;
                    s.vx = -Math.abs(s.vx);
                }

                if (s.y < -s.size / 2) {
                    s.y = -s.size / 2;
                    s.vy = Math.abs(s.vy);
                } else if (s.y > window.innerHeight - s.size / 2) {
                    s.y = window.innerHeight - s.size / 2;
                    s.vy = -Math.abs(s.vy);
                }

                // 이동 방향(벡터)을 계산하여 회전각(angle) 구하기
                // atan2는 라디안을 반환하므로 degree로 변환.
                // 해파리가 보통 위쪽을 향해 헤엄치는 형태를 가정하여 90도를 더해줌
                let angle = Math.atan2(currentVy, currentVx) * (180 / Math.PI) + 90;

                // 위치와 회전값 적용
                s.el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${angle}deg)`;
            });

            requestAnimationFrame(updateSwimmers);
        }

        // 창 크기 변경 시 위치가 크게 어긋나는 것 방지
        window.addEventListener('resize', () => {
            swimmers.forEach(s => {
                if(s.x > window.innerWidth) s.x = window.innerWidth - s.size;
                if(s.y > window.innerHeight) s.y = window.innerHeight - s.size;
            });
        });

        // 애니메이션 시작
        requestAnimationFrame(updateSwimmers);

    </script>
</body>
</html>
